; =============================================================================
; TermoMade firmware — PlatformIO monorepo
;   base_cyd     : CYD 2.8" base station (2-USB variant, ST7789)
;   node_sht4x   : room node, SHT4x (+ optional DS3231)
;   node_dht22   : room node, DHT22 (+ optional DS3231)
;   native       : PC unit tests of the control + protocol libraries (`pio test -e native`)
; Shared code lives in lib/ (pure C++, no Arduino in tm_control / tm_protocol).
; =============================================================================

[platformio]
default_envs = base_cyd, node_sht4x, node_sht31, node_dht22
src_dir = src

; ----------------------------------------------------------------- common ESP32
[esp32]
; pinned pioarduino release (Arduino-ESP32 core 3.3.x / ESP-IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D CORE_DEBUG_LEVEL=2
    -I include

; ----------------------------------------------------------------- base station
[env:base_cyd]
extends = esp32
build_src_filter = +<base/>
board_build.partitions = partitions_base.csv
build_flags =
    ${esp32.build_flags}
    -D TM_BASE=1
    ; relay input polarity: 1 = active-HIGH module (recommended, pull-DOWN on IN)
    ;                       0 = active-LOW module (pull-UP on IN, see docs/05)
    -D TM_RELAY_ACTIVE_HIGH=1
    ; display: 2-USB CYD = ST7789, BGR, no inversion (flip if colours look wrong)
    -D TM_LCD_ST7789=1
    -D TM_LCD_BGR=1
    -D TM_LCD_INVERT=0
lib_deps =
    lovyan03/LovyanGFX @ 1.2.34
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    ESP32Async/ESPAsyncWebServer @ 3.7.7
    ESP32Async/AsyncTCP @ 3.4.0

; ----------------------------------------------------------------- room node
[node]
extends = esp32
build_src_filter = +<node/>
build_flags =
    ${esp32.build_flags}
    -D TM_NODE=1

[env:node_sht4x]
extends = node
build_flags =
    ${node.build_flags}
    -D TM_NODE_SENSOR_SHT4X=1

; SHT30 / SHT31-D / SHT35 breakout (I2C 0x44): same wiring as the SHT4x
[env:node_sht31]
extends = node
build_flags =
    ${node.build_flags}
    -D TM_NODE_SENSOR_SHT4X=1
    -D TM_NODE_SENSOR_SHT31=1

[env:node_dht22]
extends = node
build_flags =
    ${node.build_flags}
    -D TM_NODE_SENSOR_DHT22=1
    ; DHT22 data pin
    -D TM_DHT_PIN=4
lib_deps =
    adafruit/DHT sensor library @ 1.4.7
    adafruit/Adafruit Unified Sensor @ 1.1.15

; ----------------------------------------------------------------- PC tests
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wshadow
    -D TM_NATIVE=1
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_DOUBLE_PRECISION=1e-12
